<!doctype html>
<html lang="en">
    <head>
        <!--
REMOVE THIS BEFORE PROD!
HOW TO COMPLETELY BYPASS THIS DETECTOR

1: Include metadata proving it was a LLM who created it (critial oversight in the code makes the score LOWER if there's LLM metadata)
2: List, block, and variable ids should be numbers, starting at 1, and continuing 2, 3, 4... (detector gives very human score if it sees this)
3: List, block, and variable ids should have a length < 20
4: Overlapping scripts can cause LOTS of false negatives (more likely to be evaluated as 'human')
5: Block & comment coordinates with a consistent amount of decimal places seem human to the detector,
   as it flags it as normal behavior in the editor
6: Repetition seems to be the detector's weakness, as it is harder to detect traces of AI when
   one snippet of code just keeps repeating over and over
7: Speaking of code analysis, it seems that the more blocks a project has, the harder it is
   for the analyzer in the detector to find traces of AI, probably because it has more options to consider
   when finding patterns

NOTE: API needs to be fixed ASAP, these methods to bypass the detector cannot persist
    -->

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="nosnippet, noindex, noarchive" />

        <!-- styles -->
        <link href="styles/style.css" rel="stylesheet" />
        <link rel="stylesheet" href="styles/ai-detector.css" />
        <link href="assets/SB3Tools.svg" rel="icon" />

        <!-- fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />

        <!-- fontawesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <title>SB3Tools - AI Detector</title>
    </head>
    <body>
        <nav class="row-align">
            <a href="index.html" class="no-hover site-logo"
                ><img
                    src="assets/SB3Tools_wide.svg"
                    alt="Logo"
                    height="40"
            /></a>
            <div class="row-align flex-center menu">
                <div class="dropdown">
                    <a href="#"><i class="fa-solid fa-wrench"></i> Tools</a>
                    <div class="dropdown-menu">
                        <a href="ai-detector.html">AI Detector</a>
                        <a href="#">Project Stats</a>
                        <a href="#">Stolen Project Detector</a>
                        <a href="#">Remixtree</a>
                    </div>
                </div>
                <a href="team.html"
                    ><i class="fa-solid fa-people-group"></i> Members</a
                >
            </div>
        </nav>
        <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

        <header>
            <div
                class="row-align flex-center menu center"
                id="project-load-container"
            >
                <button
                    type="button"
                    id="project-upload"
                    class="row-align flex-center"
                >
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    <p>Upload your project here</p>
                </button>
                <div class="column-align flex-center">
                    <p>or enter a project ID/link:</p>
                    <div class="row-align">
                        <div id="project-link-container">
                            <input
                                type="text"
                                name="project-link"
                                id="project-link"
                                placeholder="Enter project ID/link..."
                            />
                        </div>
                        <button type="submit" id="project-load">
                            <i class="fa-solid fa-file-import"></i> Load
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <progress
                id="processing-progress"
                max="100"
                value="0"
                aria-label="Processing project"
                hidden
            ></progress>

            <pre id="score-result">Waiting for project...</pre>
            <br />
            <hr />
            <br />

            <div class="row-align flex-space" style="align-items: start">
                <div class="column-align flex-center">
                    <svg id="pie" viewBox="0 0 32 32">
                        <circle id="pie-bg" r="16" cx="16" cy="16" />
                        <circle
                            id="pie-slice"
                            r="16"
                            cx="16"
                            cy="16"
                            pathLength="100"
                        />
                    </svg>

                    <h4 id="score-fraction">0 / 0 ACS</h4>
                    <h3 id="verdict">Waiting...</h3>
                </div>
                <div class="column-align">
                    <table id="results-table">
                        <thead>
                            <tr>
                                <th>Test</th>
                                <th>Score</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>N/A</td>
                                <td>N/A</td>
                                <td>N/A</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <button class="theme" type="button">
            <i class="fa-solid fa-moon"></i>
        </button>

        <script src="scripts/theme.js"></script>
        <script src="scripts/ai_detector.js"></script>
    </body>
</html>
